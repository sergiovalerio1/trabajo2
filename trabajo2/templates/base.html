  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Marca: verde bosque (confianza), esmeralda para el saldo y oro para el ahorro */
      --bosque: #0B3D2E;
      --bosque-2: #12503C;
      --esmeralda: #12795A;
      --esmeralda-texto: #0D6048;
      --oro: #F5B82E;
      --oro-fuerte: #E5A71A;
      --oro-texto: #7A5300;
      --tinta: #14201B;
      --tinta-2: #546159;
      --papel: #F4F7F5;
      --blanco: #FFFFFF;
      --linea: #DCE5E0;
      --campo: #F4F7F5;
      --ok: #12795A;     --ok-fondo: #E4F4EC;     --ok-borde: #AEDCC8;
      --aviso-fondo: #FFF4D6;                      --aviso-borde: #EDCF84;
      --error: #A8321F;  --error-fondo: #FDECE9;  --error-borde: #F2BFB6;
      --titulos: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
      --cuerpo: Figtree, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--papel); color: var(--tinta);
      font: 16px/1.45 var(--cuerpo); -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3 { font-family: var(--titulos); }

    /* Columna con forma de celular; en pantallas grandes queda centrada */
    .app {
      max-width: 440px; margin: 0 auto; background: var(--papel);
      min-height: 100vh; min-height: 100dvh;
      padding-bottom: calc(40px + env(safe-area-inset-bottom));
    }
    @media (min-width: 480px) {
      body { padding: 24px 0; background: #D5E0DB; }
      .app { min-height: calc(100vh - 48px); border-radius: 32px; overflow: hidden; box-shadow: 0 30px 70px rgba(11, 61, 46, .25); }
    }

    .logo { display: block; width: auto; height: 38px; --logo-fondo: var(--bosque); --logo-v: #F4F7F5; --logo-moneda: var(--oro); --logo-s: var(--bosque); --logo-texto: var(--bosque); }

    /* Formularios */
    label { display: block; margin: 0 0 7px; font-size: 14px; font-weight: 600; }
    .campo { margin-top: 18px; }
    .entrada {
      display: flex; align-items: center;
      background: var(--campo); border: 1.5px solid var(--linea); border-radius: 16px;
      transition: border-color .15s, background .15s, box-shadow .15s;
    }
    .entrada:focus-within { background: #fff; border-color: var(--esmeralda); box-shadow: 0 0 0 4px rgba(18, 121, 90, .16); }
    .entrada input {
      flex: 1; min-width: 0; padding: 15px 16px; border: 0; outline: 0; background: transparent;
      font: inherit; font-size: 17px; color: var(--tinta); font-variant-numeric: tabular-nums;
    }
    .entrada input::placeholder { color: #8FA097; }
    .mostrar {
      min-height: 44px; padding: 0 16px; border: 0; background: none; cursor: pointer;
      font: inherit; font-size: 14px; font-weight: 600; color: var(--esmeralda-texto);
    }
    button:focus-visible { outline: 3px solid rgba(18, 121, 90, .6); outline-offset: 2px; }

    .boton {
      display: block; width: 100%; min-height: 56px; margin-top: 24px; padding: 0 18px;
      border: 0; border-radius: 16px; cursor: pointer;
      font: inherit; font-size: 17px; font-weight: 700;
      transition: background .15s, transform .05s;
    }
    .boton:active { transform: translateY(1px); }
    .boton[disabled] { opacity: .7; cursor: progress; }
    .boton-oro    { background: var(--oro); color: var(--bosque); }
    .boton-oro:hover { background: var(--oro-fuerte); }
    .boton-bosque { background: var(--bosque); color: #fff; }
    .boton-bosque:hover { background: var(--bosque-2); }

    /* Avisos simples (errores de conexión, sesión cerrada) */
    .mensaje { margin: 0 0 14px; padding: 12px 14px; border: 1px solid; border-radius: 14px; font-size: 14.5px; font-weight: 500; }
    .mensaje.error { background: var(--error-fondo); border-color: var(--error-borde); color: var(--error); }
    .mensaje.exito { background: var(--ok-fondo);    border-color: var(--ok-borde);    color: var(--ok); }

    [hidden] { display: none !important; }

    {% block estilos %}{% endblock %}
  </style>
</head>
<body>
  {% block contenido %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
