<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Banco Ahorros{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b6e6e'/%3E%3Cpath d='M16 6 6 12v2h20v-2L16 6zm-8 10v7h3v-7H8zm6.5 0v7h3v-7h-3zM21 16v7h3v-7h-3zM6 25v2h20v-2H6z' fill='white'/%3E%3C/svg%3E">
  <style>
    :root {
      --navy: #0b2545;
      --navy-2: #13315c;
      --teal: #0b8a8a;
      --teal-dark: #086b6b;
      --teal-soft: #e3f4f4;
      --gold: #f2b134;
      --bg: #eef3f8;
      --card: #ffffff;
      --texto: #1b2a3b;
      --suave: #6b7a8d;
      --borde: #dbe3ec;
      --ok-bg: #e6f6ec;  --ok-tx: #14683a;  --ok-bd: #b5e2c6;
      --av-bg: #fff4dc;  --av-tx: #7a5200;  --av-bd: #f5d995;
      --er-bg: #fde9e9;  --er-tx: #9b1c1c;  --er-bd: #f5bcbc;
      --sombra: 0 10px 30px rgba(11, 37, 69, .12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a1626; --card: #112238; --texto: #e6edf5; --suave: #9db0c5; --borde: #24384f;
        --teal-soft: #0f3a3f;
        --ok-bg: #0f2f20; --ok-tx: #8ee0b0; --ok-bd: #1f5a3a;
        --av-bg: #33280d; --av-tx: #f6cf7a; --av-bd: #6b5217;
        --er-bg: #35161a; --er-tx: #f5a3a3; --er-bd: #6b2830;
        --sombra: 0 10px 30px rgba(0, 0, 0, .45);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      background: var(--bg); color: var(--texto); min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .marca { display: flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: .2px; }
    .marca .logo {
      width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--teal), var(--teal-dark)); box-shadow: 0 4px 12px rgba(8,107,107,.4);
    }
    .marca svg { width: 24px; height: 24px; fill: #fff; }

    /* ---------- alertas ---------- */
    .alerta {
      display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px;
      border: 1px solid; font-size: 15px; line-height: 1.45; animation: entra .35s ease;
    }
    .alerta svg { flex: none; width: 22px; height: 22px; margin-top: 1px; }
    .alerta.exito { background: var(--ok-bg); color: var(--ok-tx); border-color: var(--ok-bd); }
    .alerta.aviso { background: var(--av-bg); color: var(--av-tx); border-color: var(--av-bd); }
    .alerta.error { background: var(--er-bg); color: var(--er-tx); border-color: var(--er-bd); }
    .alerta svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    @keyframes entra { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

    /* ---------- formularios ---------- */
    label { display: block; font-size: 13px; font-weight: 600; color: var(--suave); margin: 0 0 6px; text-transform: uppercase; letter-spacing: .6px; }
    .campo { margin-bottom: 18px; }
    .entrada { position: relative; }
    .entrada svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px;
                   stroke: var(--suave); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    .entrada .signo { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--suave); font-weight: 600; pointer-events: none; }
    input[type=text], input[type=password], input[type=number] {
      width: 100%; padding: 13px 14px 13px 44px; font-size: 16px; color: var(--texto);
      background: var(--card); border: 1.5px solid var(--borde); border-radius: 12px; outline: none;
      transition: border-color .15s, box-shadow .15s; font-family: inherit;
    }
    input:focus { border-color: var(--teal); box-shadow: 0 0 0 4px rgba(11,138,138,.18); }
    input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    .boton {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
      padding: 14px 20px; font-size: 16px; font-weight: 600; font-family: inherit; color: #fff; cursor: pointer;
      background: linear-gradient(135deg, var(--teal), var(--teal-dark)); border: 0; border-radius: 12px;
      box-shadow: 0 6px 16px rgba(8,107,107,.35); transition: transform .1s, box-shadow .15s, filter .15s;
    }
    .boton:hover { filter: brightness(1.07); box-shadow: 0 8px 20px rgba(8,107,107,.45); }
    .boton:active { transform: translateY(1px); }
    .boton svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .boton.salir {
      width: auto; padding: 9px 16px; font-size: 14px; background: rgba(255,255,255,.12);
      box-shadow: none; border: 1px solid rgba(255,255,255,.28);
    }
    .boton.salir:hover { background: rgba(255,255,255,.22); box-shadow: none; filter: none; }
  </style>
  {% block estilos %}{% endblock %}
</head>
<body>
  {% block contenido %}{% endblock %}
</body>
</html>
